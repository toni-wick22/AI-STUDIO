<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#020617"/>
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" stroke="#1e293b"/>
  <text x="70" y="80" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Privacy &amp; Data Security</text>
  <text x="70" y="105" fill="#10b981" font-family="sans-serif" font-size="12">100% offline-first architecture | No accounts | No tracking | Pure local sandbox</text>

  <!-- Feature Grid -->
  <rect x="70" y="130" width="310" height="90" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="90" y="160" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Zero Invasive Permissions</text>
  <text x="90" y="180" fill="#94a3b8" font-family="sans-serif" font-size="10">No overlay, accessibility, camera, or broad storage</text>

  <rect x="410" y="130" width="310" height="90" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="430" y="160" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">No Cloud Accounts</text>
  <text x="430" y="180" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero registration required. Local storage only.</text>

  <!-- Purge Action Box -->
  <rect x="70" y="240" width="650" height="80" rx="12" fill="#4c0519" stroke="#9f1239"/>
  <text x="100" y="275" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold">Purge All Local Data</text>
  <text x="100" y="295" fill="#fecdd3" font-family="sans-serif" font-size="11">Clears all cached drills, table positions, and custom settings</text>

  <rect x="520" y="258" width="180" height="42" rx="10" fill="#e11d48"/>
  <text x="610" y="284" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Delete All Local Data</text>
</svg>
