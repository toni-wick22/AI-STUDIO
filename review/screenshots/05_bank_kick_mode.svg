<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#020617"/>
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" stroke="#1e293b"/>
  <text x="70" y="80" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">1-Cushion Bank Shot Mirror System</text>
  <text x="70" y="105" fill="#f59e0b" font-family="sans-serif" font-size="12">Mathematical reflection: angle of incidence equals angle of reflection</text>

  <!-- Cushion Rail -->
  <rect x="100" y="140" width="600" height="20" fill="#14532d"/>

  <!-- Target Ball -->
  <circle cx="250" cy="320" r="20" fill="#facc15"/>
  <text x="250" y="325" fill="#713f12" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Target</text>

  <!-- Bounce Point Diamond -->
  <polygon points="400,150 410,160 400,170 390,160" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="190" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bounce Point</text>

  <!-- Corner Pocket -->
  <circle cx="550" cy="320" r="24" fill="#000000" stroke="#facc15" stroke-width="2"/>
  <text x="550" y="325" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Pocket</text>

  <!-- Bank Paths -->
  <line x1="250" y1="320" x2="400" y2="160" stroke="#facc15" stroke-width="3"/>
  <line x1="400" y1="160" x2="550" y2="320" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4"/>
</svg>
