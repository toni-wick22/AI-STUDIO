<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#020617"/>
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" stroke="#1e293b"/>
  <text x="70" y="80" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Optional Image Calibration Workspace</text>
  <text x="70" y="105" fill="#38bdf8" font-family="sans-serif" font-size="12">100% in-browser sandbox photo picker with 4-corner perspective quad calibration</text>

  <!-- Photo Quad Area -->
  <rect x="70" y="130" width="460" height="240" rx="12" fill="#020617" stroke="#334155"/>
  <polygon points="120,160 480,170 450,340 100,320" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 4 Corner Pins -->
  <circle cx="120" cy="160" r="10" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <circle cx="480" cy="170" r="10" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <circle cx="100" cy="320" r="10" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <circle cx="450" cy="340" r="10" fill="#f59e0b" stroke="#fff" stroke-width="2"/>

  <!-- Delete Button -->
  <rect x="550" y="130" width="180" height="40" rx="10" fill="#881337" stroke="#be123c"/>
  <text x="640" y="155" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Delete Image &amp; Analysis</text>
</svg>
