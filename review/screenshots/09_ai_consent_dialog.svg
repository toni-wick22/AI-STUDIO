<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#020617"/>
  <!-- Backdrop -->
  <rect width="800" height="450" fill="#000" fill-opacity="0.7"/>

  <!-- Modal Dialog -->
  <rect x="150" y="60" width="500" height="330" rx="20" fill="#0f172a" stroke="#334155"/>
  <circle cx="190" cy="100" r="16" fill="#10b981" fill-opacity="0.2"/>
  <text x="220" y="105" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Optional AI Features Disclosure</text>
  <text x="220" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11">Google Play Data Safety &amp; AI Transparency</text>

  <!-- Content Box -->
  <rect x="180" y="145" width="440" height="160" rx="12" fill="#020617" stroke="#1e293b"/>
  <text x="200" y="175" fill="#e2e8f0" font-family="sans-serif" font-size="11">✓ Offline Independence: Simulator works 100% offline without AI.</text>
  <text x="200" y="205" fill="#e2e8f0" font-family="sans-serif" font-size="11">✓ Data Transmitted: Only user prompt &amp; numerical shot angles.</text>
  <text x="200" y="235" fill="#e2e8f0" font-family="sans-serif" font-size="11">✓ Strict Image Privacy: Imported photos are NEVER uploaded.</text>
  <text x="200" y="265" fill="#e2e8f0" font-family="sans-serif" font-size="11">✓ User Control: AI disabled by default. Delete history anytime.</text>

  <!-- Buttons -->
  <rect x="330" y="325" width="140" height="40" rx="10" fill="#1e293b"/>
  <text x="400" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Keep AI Disabled</text>

  <rect x="490" y="325" width="130" height="40" rx="10" fill="#10b981"/>
  <text x="555" y="350" fill="#020617" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">I Agree &amp; Enable</text>
</svg>
