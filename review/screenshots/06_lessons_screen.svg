  <rect x="330" y="180" width="380" height="40" rx="8" fill="#064e3b" stroke="#059669"/>
  <text x="345" y="205" fill="#a7f3d0" font-family="monospace" font-size="11" font-weight="bold">Ghost Center = Target - 2R * (Target-to-Pocket Vector)</text>

