  <text x="95" y="168" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">1. Direct Shots &amp; Ghost Ball</text>

  <rect x="80" y="190" width="200" height="36" rx="8" fill="#1e293b" fill-opacity="0.5"/>
