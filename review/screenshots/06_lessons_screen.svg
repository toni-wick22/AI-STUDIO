  <rect x="80" y="280" width="200" height="36" rx="8" fill="#1e293b" fill-opacity="0.5"/>
  <text x="95" y="303" fill="#cbd5e1" font-family="sans-serif" font-size="11">4. Bank Shots &amp; Mirror System</text>

  <rect x="80" y="325" width="200" height="36" rx="8" fill="#1e293b" fill-opacity="0.5"/>
  <text x="95" y="348" fill="#cbd5e1" font-family="sans-serif" font-size="11">5. Kick Shots &amp; Escaping Snookers</text>

