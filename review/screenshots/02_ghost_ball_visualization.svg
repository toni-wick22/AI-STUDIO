<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#020617"/>
  <rect x="40" y="40" width="720" height="370" rx="20" fill="#0f172a" stroke="#1e293b"/>
  <!-- Title -->
  <text x="70" y="80" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Ghost-Ball Geometry Verification</text>
  <text x="70" y="105" fill="#94a3b8" font-family="sans-serif" font-size="12">Distance between Target Ball center and Ghost Ball center = 2R exactly</text>

  <!-- Diagram -->
  <circle cx="200" cy="240" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="245" fill="#000" font-family="sans-serif" font-weight="bold" text-anchor="middle">Cue</text>

  <line x1="200" y1="240" x2="440" y2="240" stroke="#ffffff" stroke-width="4"/>

  <!-- Ghost Ball -->
  <circle cx="440" cy="240" r="30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="440" cy="240" r="4" fill="#38bdf8"/>
  <text x="440" y="285" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ghost Center (G)</text>

  <!-- Target Ball -->
  <circle cx="500" cy="240" r="30" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="245" fill="#713f12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Target (T)</text>

  <!-- Vector Dimension: 2R -->
  <line x1="440" y1="180" x2="500" y2="180" stroke="#34d399" stroke-width="2"/>
  <text x="470" y="170" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2 × R = 28px</text>
</svg>
